[package]
name = "octopush"
version = "0.4.89"
description = "The IDE for Agentic Developers"
authors = ["Octopush contributors"]
edition = "2021"
rust-version = "1.77.2"
# `[[bin]]` adds octopush-pty-server below; with multiple binaries Tauri
# needs to be told which one is the app shell.
default-run = "octopush"

[lib]
name = "octopush_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "octopush-pty-server"
path = "src/bin/octopush-pty-server/main.rs"

# Standalone Model Context Protocol server. Speaks JSON-RPC 2.0 over stdio and
# exposes Octopush's pipeline-authoring and workspace surface to MCP clients
# (Claude Code first). Drives `octopush_lib::db` directly — no app required.
[[bin]]
name = "octopush-mcp"
path = "src/bin/octopush-mcp/main.rs"

# Detached run worker: drives ONE segment of a Direct run out of process so
# crews survive the app quitting (Pro `runs.detached`). Uses octopush_lib's
# orchestrator directly; never migrates the DB, never touches the keychain.
[[bin]]
name = "octopush-run-worker"
path = "src/bin/octopush-run-worker/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
# Canonical paths without Windows' `\\?\` verbatim prefix (Open With).
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
anyhow = "1"
git2 = { version = "0.19", features = ["vendored-openssl", "vendored-libgit2"] }
thiserror = "2"
parking_lot = "0.12"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# reqwest 0.13 made rustls (aws-lc) the default TLS backend and turned
# `query`/`form` into opt-in features. Default features are off so this keeps
# 0.12's behaviour: native-tls (OS trust store) without ALPN, i.e. HTTP/1.1 over
# TLS, as before, plus charset, http2 and the system proxy (0.12's
# `macos-system-configuration`, now `system-proxy`).
reqwest = { version = "0.13", default-features = false, features = [
    "native-tls-no-alpn",
    "charset",
    "http2",
    "system-proxy",
    "json",
    "stream",
    "form",
    "query",
] }
futures-util = "0.3"
async-trait = "0.1"
tempfile = "3"
regex = "1"
ignore = "0.4"
globset = "0.4"
base64 = "0.23"
urlencoding = "2"
sha2 = "0.10"
keyring = { version = "3", features = ["apple-native"] }
libc = "0.2"
ctrlc = "3"
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk"] }

[dev-dependencies]
serial_test = "3"

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
