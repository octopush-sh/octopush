# Nightly visual audit (scripts/visual-audit/README.md, docs/ROUTINES.md, #313).
#
# Renders every surface of the real frontend in WebKit — the engine Octopush
# runs on macOS — with real-world data (the `stress` scenario), at three window
# sizes, and runs deterministic layout checks: text escaping its box, text over
# text, text cut without an ellipsis, sideways scroll, controls without a
# label. New defects become `visual` issues; the first few are `ready`, so the
# nightly builder fixes them the same night. Then a read-only Claude design
# reviewer looks at the screenshots; its findings go to the digest as ideas.
# Runs on main only. 00:29 Bogotá — before the builder (01:07).
name: visual-audit

on:
  schedule:
    - cron: "29 5 * * *"
  workflow_dispatch:
    inputs:
      file_issues:
        description: "File issues for the findings"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write   # file / reopen `visual` issues

concurrency:
  group: visual-audit
  cancel-in-progress: false

env:
  OCTOPUSH_ROUTINE_REPO: ${{ github.repository }}
  PLAYWRIGHT_VERSION: "1.64.1"

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --ignore-scripts
          npm install --no-save --no-audit --no-fund --ignore-scripts "playwright@$PLAYWRIGHT_VERSION"
          npx playwright install webkit

      - name: Audit (WebKit, stress data and a fresh install)
        id: audit
        run: |
          set +e
          node scripts/visual-audit/audit.mjs --engine webkit --scenario stress,empty --out "$RUNNER_TEMP/visual-audit"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 0 = clean, 1 = findings (filed below); anything else is the audit failing.
          [ "$rc" -le 1 ] || exit "$rc"

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: ${{ runner.temp }}/visual-audit
          retention-days: 14
          if-no-files-found: ignore

      - name: File issues
        if: steps.audit.outputs.rc == '1' && (github.event_name == 'schedule' || inputs.file_issues)
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/visual-audit/file.mjs "$RUNNER_TEMP/visual-audit/findings.json"

  design-review:
    # A Claude agent reads tonight's screenshots against the design system for
    # what rules can't see (spacing, hierarchy, brass overuse…). Read-only
    # tools, no GitHub access (agent.mjs); its findings are validated and filed
    # as `proposal` issues — never straight to the builder.
    needs: audit
    # Even if filing failed: the screenshots are uploaded either way.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.audit.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CLAUDE_CODE_VERSION: "2.1.314"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: visual-audit
          path: ${{ runner.temp }}/visual-audit

      - name: Prepare
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp -R scripts "$RUNNER_TEMP/scripts"   # trusted copy, outside the agent's directory
          work=/tmp/design-review; rm -rf "$work"; mkdir -p "$work/shots" "$work/docs"
          # One size is enough for taste; it keeps the agent's reading bounded.
          find "$RUNNER_TEMP/visual-audit/shots" -name '*--1280x800.png' -exec cp {} "$work/shots/" \; 2>/dev/null || true
          n=$(ls "$work/shots" | wc -l | tr -d ' ')
          [ -f "$RUNNER_TEMP/visual-audit/findings.json" ] || n=0
          echo "shots=$n" >> "$GITHUB_OUTPUT"
          cp CLAUDE.md "$work/"; cp docs/design-system.md "$work/docs/"
          {
            cat "$RUNNER_TEMP/scripts/visual-audit/design-brief.md"
            echo
            node -e 'const r=require(process.argv[1]); for (const f of r.findings) console.log(`- ${f.check}: ${f.surfaces.join(", ")} — ${f.selector}`); if(!r.findings.length) console.log("(none)")' "$RUNNER_TEMP/visual-audit/findings.json" || echo "(no findings file)"
            echo
            echo "# Already proposed (open, or declined — don't propose these again)"
            gh api "repos/$GITHUB_REPOSITORY/issues?state=all&labels=visual,proposal&per_page=100" \
              --jq '.[] | "- \(.title) [\(.state)]"' || echo "(couldn't list them)"
          } > "$RUNNER_TEMP/design-prompt.md"
          npm install --global --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - name: Review (Claude agent, no GitHub access)
        if: steps.prep.outputs.shots != '0'
        timeout-minutes: 30
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: cd /tmp/design-review && node "$RUNNER_TEMP/scripts/routines/agent.mjs" reviewer "$RUNNER_TEMP/design-prompt.md"

      - name: File proposals
        if: steps.prep.outputs.shots != '0' && (github.event_name == 'schedule' || inputs.file_issues)
        env:
          GH_TOKEN: ${{ github.token }}
          OCTOPUSH_SECRETS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          f=/tmp/design-review/.agent-out/design.json
          [ -f "$f" ] || { echo "the design reviewer wrote nothing tonight"; exit 0; }
          if node -e 'const s=process.env.OCTOPUSH_SECRETS.trim(); process.exit(s.length>=8 && require("fs").readFileSync(process.argv[1],"utf8").includes(s)?0:1)' "$f"; then
            echo "::error::design.json contains a secret value — not filed"; exit 1
          fi
          env -u OCTOPUSH_SECRETS node "$RUNNER_TEMP/scripts/visual-audit/file.mjs" --design "$f" "$RUNNER_TEMP/visual-audit/findings.json"
