# Nightly builder (VISION.md §8, docs/ROUTINES.md).
#
# Takes ONE job — a PR the review sent back or whose CI is red, else the oldest
# `ready` issue — and has a Claude agent build it. The agent runs with no GitHub
# credential: its checks run as a separate user, the checkout's .git is moved out
# of its reach, and the publishing step runs a copy of scripts/routines taken
# before it started. Two runs a night (01:07 and 01:47 Bogotá).
name: nightly-build

on:
  schedule:
    - cron: "7 6 * * *"
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: write       # push the agent's branch
  pull-requests: write  # open / update its PR
  issues: write         # claim, label, comment
  actions: write        # dispatch CI on the branch (GITHUB_TOKEN pushes don't trigger it)

concurrency:
  group: nightly-build
  cancel-in-progress: false

env:
  OCTOPUSH_OWNER_LOGIN: ${{ vars.OCTOPUSH_OWNER_LOGIN }}
  OCTOPUSH_ROUTINE_REPO: ${{ github.repository }}
  CLAUDE_CODE_VERSION: "2.1.314"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Pick a job
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if node scripts/routines/jobs.mjs next > "$RUNNER_TEMP/job.tsv"; then
            IFS=$'\t' read -r kind num third _ < "$RUNNER_TEMP/job.tsv"
            echo "kind=$kind" >> "$GITHUB_OUTPUT"
            echo "num=$num" >> "$GITHUB_OUTPUT"
            if [ "$kind" = pr ]; then echo "branch=$third" >> "$GITHUB_OUTPUT"; fi
            echo "job: $kind #$num"
          else
            echo "nothing to build"
          fi

      - name: Claim it
        if: steps.pick.outputs.kind != ''
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.pick.outputs.kind }}
          NUM: ${{ steps.pick.outputs.num }}
        run: node scripts/routines/jobs.mjs claim "$KIND" "$NUM"

      - name: Trusted copy of the routines (from main)
        if: steps.pick.outputs.kind != ''
        # Taken BEFORE any agent branch is checked out: everything that runs
        # with a token from here on (context, sandbox setup, publishing,
        # releasing the claim) comes from main, never from the agent's work.
        run: cp -R scripts/routines "$RUNNER_TEMP/routines"

      - name: Context and brief
        if: steps.pick.outputs.kind != ''
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.pick.outputs.kind }}
          NUM: ${{ steps.pick.outputs.num }}
          BRANCH: ${{ steps.pick.outputs.branch }}
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/routines"
          if [ "$KIND" = pr ]; then
            [[ "$BRANCH" =~ ^agent/[A-Za-z0-9._/-]+$ ]] || { echo "unexpected branch name"; exit 1; }
            git fetch --quiet origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git checkout --quiet -B "$BRANCH" "origin/$BRANCH"
          fi
          {
            cat "$R/briefs/builder.md"
            echo
            node "$R/read.mjs" "$KIND" "$NUM"
            if [ "$KIND" = pr ]; then
              echo; echo "## Failing CI checks on the PR's head (if any)"
              sha="$(git rev-parse HEAD)"
              gh api "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs" \
                --jq '.check_runs[] | select(.conclusion == "failure") | .id' |
              while read -r id; do
                gh api "repos/$GITHUB_REPOSITORY/check-runs/$id/annotations" --jq '.[] | "- \(.path):\(.start_line) \(.message)"' | head -n 40
              done
            fi
          } > "$RUNNER_TEMP/prompt.md"

      - name: Install and sandbox (no GitHub token in this step)
        if: steps.pick.outputs.kind != ''
        run: |
          set -euo pipefail
          # The branch's dependencies, without lifecycle scripts (manifests and
          # lockfile are human-only, but nothing from the branch runs here).
          npm ci --no-audit --no-fund --ignore-scripts
          npm install --global --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          # Out of the agent's (and the sandbox's) reach from here on.
          mv .git "$RUNNER_TEMP/repo.git"
          OCTOPUSH_CHECKOUT="$GITHUB_WORKSPACE" bash "$RUNNER_TEMP/routines/agent-sandbox-setup.sh"

      - name: Build (Claude agent, no GitHub access)
        if: steps.pick.outputs.kind != ''
        timeout-minutes: 75
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node "$RUNNER_TEMP/routines/agent.mjs" builder "$RUNNER_TEMP/prompt.md"

      - name: Stop the sandbox and freeze the checkout
        if: always() && steps.pick.outputs.kind != ''
        # Nothing the checks started may keep changing files while they're
        # scanned and committed.
        run: |
          sudo pkill -KILL -u octo-sandbox || true
          sudo find "$GITHUB_WORKSPACE" -type l -user octo-sandbox -delete || true
          chmod -R o-w "$GITHUB_WORKSPACE" || true

      - name: Publish
        if: steps.pick.outputs.kind != '' && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          OCTOPUSH_GIT_DIR: ${{ runner.temp }}/repo.git
          OCTOPUSH_SECRETS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          KIND: ${{ steps.pick.outputs.kind }}
          NUM: ${{ steps.pick.outputs.num }}
          BRANCH: ${{ steps.pick.outputs.branch }}
        run: node "$RUNNER_TEMP/routines/publish-build.mjs" "$KIND" "$NUM" "$BRANCH"

      - name: Release the claim
        if: always() && steps.pick.outputs.kind != ''
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.pick.outputs.kind }}
          NUM: ${{ steps.pick.outputs.num }}
        run: node "$RUNNER_TEMP/routines/jobs.mjs" release "$KIND" "$NUM" || true
