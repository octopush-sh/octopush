# Nightly builder (VISION.md §8, docs/ROUTINES.md).
#
# Takes ONE job — the cycle's "main is red" issue while main's CI fails, else
# a PR the review sent back, whose CI is red or that conflicts with main, else
# the oldest `ready` issue — and has a Claude agent build it. The agent runs with no GitHub
# credential: its checks run as a separate user, the checkout's .git is moved out
# of its reach, and the publishing step runs a copy of scripts/routines taken
# before it started. Agent and dependency code run without access to
# credentials: Node and the Claude Code CLI are a root-owned, read-only copy
# (scripts/routines/frozen-node.sh), and before each step that runs after the
# agent, `frozen-node.sh guard` proves the sandbox user gone and nothing the
# runner executes changed or open to it. Runs every two hours (at :07, Bogotá even hours); an
# empty queue costs a minute and no agent.
name: nightly-build

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write       # push the agent's branch
  pull-requests: write  # open / update its PR
  issues: write         # claim, label, comment
  actions: write        # dispatch CI on the branch (GITHUB_TOKEN pushes don't trigger it)

concurrency:
  group: nightly-build
  cancel-in-progress: false

env:
  OCTOPUSH_OWNER_LOGIN: ${{ vars.OCTOPUSH_OWNER_LOGIN }}
  OCTOPUSH_ROUTINE_REPO: ${{ github.repository }}
  CLAUDE_CODE_VERSION: "2.1.314"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Re-run CI that only lost its runner
        # A job GitHub never gave a macOS runner is not red CI: re-run it so
        # the PR isn't sent to a fix round or skipped by the review.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OCTOPUSH_ROUTINE_REPO: ${{ github.repository }}
          OCTOPUSH_ROUTINES_KEEP_PATH: "1"
        run: bash scripts/routines/rerun-starved.sh

      - name: Pick a job
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if node scripts/routines/jobs.mjs next > "$RUNNER_TEMP/job.tsv"; then
            IFS=$'\t' read -r kind num third _ < "$RUNNER_TEMP/job.tsv"
            echo "kind=$kind" >> "$GITHUB_OUTPUT"
            echo "num=$num" >> "$GITHUB_OUTPUT"
            if [ "$kind" = pr ]; then echo "branch=$third" >> "$GITHUB_OUTPUT"; fi
            echo "job: $kind #$num"
          else
            echo "nothing to build"
          fi

      - name: Claim it
        if: steps.pick.outputs.kind != ''
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.pick.outputs.kind }}
          NUM: ${{ steps.pick.outputs.num }}
        run: node scripts/routines/jobs.mjs claim "$KIND" "$NUM"

      - name: Trusted copy of the routines (from main)
        if: steps.pick.outputs.kind != ''
        # Taken BEFORE any agent branch is checked out: everything that runs
        # with a token from here on (context, sandbox setup, publishing,
        # releasing the claim) comes from main, never from the agent's work.
        run: cp -R scripts/routines "$RUNNER_TEMP/routines"

      - name: Node 22 and the Claude Code CLI, root-owned and read-only (before any agent branch)
        if: steps.pick.outputs.kind != ''
        # The sandbox's checks can write the runner's shared tool cache, so the
        # agent and every later step run this copy instead: the CLI is installed
        # into it here, with no token in this step, then the whole tree becomes
        # root-owned and read-only and comes first on PATH. What the runner
        # executes from here on is closed to other users (frozen-node.sh).
        run: OCTO_NODE_GLOBALS="@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" bash "$RUNNER_TEMP/routines/frozen-node.sh" freeze

      - name: Context and brief
        if: steps.pick.outputs.kind != ''
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.pick.outputs.kind }}
          NUM: ${{ steps.pick.outputs.num }}
          BRANCH: ${{ steps.pick.outputs.branch }}
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/routines"
          merged_main=""
          if [ "$KIND" = pr ]; then
            [[ "$BRANCH" =~ ^agent/[A-Za-z0-9._/-]+$ ]] || { echo "unexpected branch name"; exit 1; }
            git fetch --quiet origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git checkout --quiet -B "$BRANCH" "origin/$BRANCH"
            # Bring main in first, so the fix round works on today's code (a fix
            # that needs another PR's change found it missing: #385). A clean
            # merge is committed as is. A conflicted one is committed WITH its
            # conflict markers only if every conflicted file has them, and
            # resolving them is this round's work (#1072); publish-build.mjs
            # refuses to push while one still has a marker. A conflict Git can't
            # mark (binary, deleted on one side) is aborted and parks the PR.
            merged_main="$(bash "$R/merge-main.sh" "$RUNNER_TEMP")" || {
              merged_main=failed
              git merge --abort 2>/dev/null || git reset --quiet --hard "origin/$BRANCH"
              : > "$RUNNER_TEMP/conflicts.txt"; : > "$RUNNER_TEMP/unmergeable.txt"
            }
            echo "merging main: $merged_main"
            [ "$merged_main" != failed ] || { echo "::warning::merging main failed without a conflict:"; cat "$RUNNER_TEMP/merge-main.log"; }
          fi
          {
            cat "$R/briefs/builder.md"
            echo
            node "$R/read.mjs" "$KIND" "$NUM"
            if [ "$KIND" = pr ] && [ "$merged_main" = merged ]; then
              echo; echo "## This branch now includes main"
              echo "Before this run, main was merged into the branch cleanly (a commit of its own). Build on it; don't undo it."
              echo "If nothing was sent back and CI isn't red, bringing main in may be the whole round: then write an \`update\` saying so."
            fi
            if [ "$KIND" = pr ] && [ "$merged_main" = conflicts ]; then
              echo; echo "## This branch conflicts with main: resolve the conflicts"
              echo "Main was merged into this branch and the merge is committed with Git's conflict markers left in these files:"
              awk 'NR<=50' "$RUNNER_TEMP/conflicts.txt" | sed 's/^/- /'
              echo
              echo "Each conflict reads \`<<<<<<<\` (this branch), \`|||||||\` (the common base), \`=======\`, then main's version up to \`>>>>>>>\`."
              echo "Resolve every one so both changes survive (main's and this PR's), delete every marker line, then do what the review asks, if anything, and run \`octo-check all\`."
              echo "If a conflicted file is one you may not touch, or the two changes can't both stand, stop and say which and why. Nothing is pushed while a marker is left."
            fi
            if [ "$KIND" = pr ] && [ "$merged_main" = unmergeable ]; then
              echo; echo "## This branch conflicts with main in files Git can't mark"
              echo "Merging main conflicts in files that get no conflict markers (binary, or deleted on one side), so this checkout is the branch WITHOUT main:"
              awk 'NR<=50' "$RUNNER_TEMP/unmergeable.txt" | sed 's/^/- /'
              echo "The PM resolves these: stop and say so. This PR is parked whatever you write."
            fi
            if [ "$KIND" = pr ]; then
              echo; echo "## Failing CI on the PR's head (if any)"
              sha="$(git rev-parse "origin/$BRANCH")"   # the PR's head, not the merge with main
              # The failed jobs' logs, read here with the workflow's token (the
              # agent never fetches anything): failing steps, first error lines,
              # failing test names, redacted, bounded and fenced as untrusted
              # data. Never fatal: missing CI context must not stop the build.
              node "$R/ci-failures.mjs" "$GITHUB_REPOSITORY" "$sha" || echo "(CI checks unavailable)"
            fi
          } > "$RUNNER_TEMP/prompt.md"

      - name: Install and sandbox (no GitHub token in this step)
        if: steps.pick.outputs.kind != ''
        run: |
          set -euo pipefail
          # The branch's dependencies, without lifecycle scripts (manifests and
          # lockfile are human-only, but nothing from the branch runs here).
          npm ci --no-audit --no-fund --ignore-scripts
          for c in node npm npx claude; do
            [ "$(command -v "$c")" = "/opt/octo-node/bin/$c" ] || { echo "::error::$c is not the frozen copy"; exit 1; }
          done
          # Out of the agent's (and the sandbox's) reach from here on.
          mv .git "$RUNNER_TEMP/repo.git"
          OCTOPUSH_CHECKOUT="$GITHUB_WORKSPACE" bash "$RUNNER_TEMP/routines/agent-sandbox-setup.sh"

      - name: Build (Claude agent, no GitHub access)
        if: steps.pick.outputs.kind != ''
        timeout-minutes: 75
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node "$RUNNER_TEMP/routines/agent.mjs" builder "$RUNNER_TEMP/prompt.md"

      - name: Stop the sandbox and freeze the checkout
        id: sandbox-gone
        if: always() && steps.pick.outputs.kind != ''
        # Nothing the checks started may keep changing files while they're
        # scanned and committed. `end` kills every process of the sandbox user
        # at once and locks the account, then closes the checkout's top
        # directory and removes a .git there: the checkout's own is in the
        # runner's temp dir, one here now is the sandbox's, and actions/checkout's
        # post step would run git in it. It fails the step if there was one.
        # Not resolved through PATH: guard checks PATH.
        shell: /usr/bin/bash --noprofile --norc -e {0}
        run: |
          job_path="$PATH"
          PATH=/usr/sbin:/usr/bin:/sbin:/bin
          /usr/bin/bash "$RUNNER_TEMP/routines/frozen-node.sh" end "$GITHUB_WORKSPACE"
          sudo find "$GITHUB_WORKSPACE" -type l -user octo-sandbox -delete || true
          chmod -R o-w "$GITHUB_WORKSPACE" || true
          PATH="$job_path" /usr/bin/bash "$RUNNER_TEMP/routines/frozen-node.sh" guard "$RUNNER_TEMP/routines" "$RUNNER_TEMP/repo.git"

      - name: Publish
        if: steps.pick.outputs.kind != '' && !cancelled() && steps.sandbox-gone.outcome == 'success'
        shell: /usr/bin/bash --noprofile --norc -e {0}
        env:
          GH_TOKEN: ${{ github.token }}
          OCTOPUSH_GIT_DIR: ${{ runner.temp }}/repo.git
          OCTOPUSH_SECRETS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Files main's merge left with conflict markers (outside the agent's reach): none may keep one;
          # and files whose conflict Git couldn't mark: any at all parks the PR (merge-main.sh).
          OCTOPUSH_CONFLICTS_FILE: ${{ runner.temp }}/conflicts.txt
          OCTOPUSH_UNMERGEABLE_FILE: ${{ runner.temp }}/unmergeable.txt
          KIND: ${{ steps.pick.outputs.kind }}
          NUM: ${{ steps.pick.outputs.num }}
          BRANCH: ${{ steps.pick.outputs.branch }}
        run: |
          /usr/bin/bash "$RUNNER_TEMP/routines/frozen-node.sh" guard "$RUNNER_TEMP/routines" "$RUNNER_TEMP/repo.git"
          node "$RUNNER_TEMP/routines/publish-build.mjs" "$KIND" "$NUM" "$BRANCH"

      - name: Release the claim
        if: always() && steps.pick.outputs.kind != ''
        shell: /usr/bin/bash --noprofile --norc -e {0}
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ steps.pick.outputs.kind }}
          NUM: ${{ steps.pick.outputs.num }}
        run: |
          /usr/bin/bash "$RUNNER_TEMP/routines/frozen-node.sh" guard "$RUNNER_TEMP/routines"
          node "$RUNNER_TEMP/routines/jobs.mjs" release "$KIND" "$NUM" || true

      - name: Nothing the post steps run has changed, and no checkout has a .git of the sandbox's
        # The actions' post steps (setup-node's cache, checkout's clean-up) run
        # after this one, on the runner's own Node and git.
        if: always() && steps.pick.outputs.kind != ''
        shell: /usr/bin/bash --noprofile --norc -e {0}
        run: |
          /usr/bin/bash "$RUNNER_TEMP/routines/frozen-node.sh" end "$GITHUB_WORKSPACE"
          /usr/bin/bash "$RUNNER_TEMP/routines/frozen-node.sh" guard "$RUNNER_TEMP/routines"
