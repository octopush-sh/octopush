# Epiku review + guarded auto-merge (VISION.md §8, docs/ROUTINES.md "The Epiku
# lane"), for octopush-sh/epiku — a PRIVATE repo.
#
# Job `review`: for each Epiku agent PR with green CI and no verdict on its
# head commit, a Claude reviewer agent (read-only tools, no GitHub access),
# briefed to find reasons to REJECT it, judges the change against Epiku's
# data-safety and tenant-isolation rules and writes a verdict file with a
# data/API classification (none | additive | breaking); a fixed step posts it
# as the cycle App's bot, signed for that exact commit. Same hardening as
# web-review.yml: the PR as a git archive, no symlinks, main's agent docs, and
# the installation token that reads the PRs revoked before any agent runs.
#
# Job `merge`: a FRESH runner on which no agent and no Epiku code ever ran.
# `automerge.mjs --repo epiku merge` re-reads every PR approved on its current
# head and re-checks every rule (`epikuRefusals`): the builder's PR from a
# branch of epiku into main, CI green and the approval on that exact commit, it
# closes a `ready` issue, at most 800 changed lines, no human-only path, no
# guard test, no environment read, no removed route, not classified breaking,
# and the proof an additive change needs. It merges that commit, or parks the
# PR for the owner (`needs-owner`, with the reasons on the PR). Nothing passes
# between the two jobs: the merge job trusts only what is signed on the PR.
#
# The merge job really merges only when the repository variable
# EPIKU_AUTOMERGE is exactly `true`. Otherwise it gets a READ-ONLY token and
# does a dry run: it prints what it would do and writes nothing.
#
# THIS REPO IS PUBLIC AND EPIKU IS PRIVATE: steps print PR numbers, commit ids
# and reason codes only — never a title, a body, a file path or a diff.
#
# Manual runs only until the owner enables the schedule: uncomment the two
# `schedule` lines (odd hours at :22, between the Epiku builder's runs).
name: epiku-review

on:
  # schedule:
  #   - cron: "22 1-23/2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: epiku-review
  cancel-in-progress: false

env:
  OCTOPUSH_OWNER_LOGIN: ${{ vars.OCTOPUSH_OWNER_LOGIN }}
  OCTOPUSH_ROUTINE_REPO: ${{ github.repository }}
  EPIKU_REPO: octopush-sh/epiku
  CLAUDE_CODE_VERSION: "2.1.314"
  MAX_PRS: "3"

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Trusted copy of the routines (from main)
        run: cp -R scripts/routines "$RUNNER_TEMP/routines"

      - name: Epiku token (read — revoked before the agents)
        id: read-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OCTOPUSH_APP_ID }}
          private-key: ${{ secrets.OCTOPUSH_APP_PRIVATE_KEY }}
          owner: octopush-sh
          repositories: epiku
          skip-token-revoke: true   # revoked explicitly below, before any agent runs
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-actions: read

      - name: Queue
        id: queue
        env:
          OCTOPUSH_EPIKU_TOKEN: ${{ steps.read-token.outputs.token }}
          OCTOPUSH_APP_BOT_LOGIN: ${{ steps.read-token.outputs.app-slug }}[bot]
        run: |
          set -euo pipefail
          echo "bot=${OCTOPUSH_APP_BOT_LOGIN}" >> "$GITHUB_OUTPUT"
          # For Epiku the queue is `number<TAB>head-sha` and nothing else.
          node "$RUNNER_TEMP/routines/automerge.mjs" --repo "$EPIKU_REPO" queue | head -n "$MAX_PRS" > "$RUNNER_TEMP/queue.tsv"
          echo "count=$(wc -l < "$RUNNER_TEMP/queue.tsv" | tr -d ' ')" >> "$GITHUB_OUTPUT"
          cut -f1,2 "$RUNNER_TEMP/queue.tsv"

      - name: Check out epiku (main)
        if: steps.queue.outputs.count != '0'
        uses: actions/checkout@v7
        with:
          repository: octopush-sh/epiku
          token: ${{ steps.read-token.outputs.token }}
          path: epiku-main
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare each PR (archive, prompt)
        if: steps.queue.outputs.count != '0'
        env:
          OCTOPUSH_EPIKU_TOKEN: ${{ steps.read-token.outputs.token }}
          OCTOPUSH_APP_BOT_LOGIN: ${{ steps.queue.outputs.bot }}
        run: |
          set -uo pipefail
          R="$RUNNER_TEMP/routines"
          # The token reaches git through the environment, never a command line or a config file.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$OCTOPUSH_EPIKU_TOKEN" | base64 -w0)"
          : > "$RUNNER_TEMP/ready.tsv"
          while IFS=$'\t' read -r num sha _; do
            [[ "$num" =~ ^[0-9]+$ && "$sha" =~ ^[0-9a-f]{40}$ ]] || continue
            if ! GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="$auth" \
                 git -C epiku-main fetch --quiet origin "pull/$num/head" 2>/dev/null; then echo "epiku#$num: fetch failed"; continue; fi
            work="/tmp/epiku-review/pr-$num"; rm -rf "$work"; mkdir -p "$work"
            # The PR's code without .git; main's agent docs and direction, so the PR can't brief its own reviewer.
            git -C epiku-main archive "$sha" | tar -x -C "$work"
            find "$work" -type l -delete
            find "$work" \( -iname 'CLAUDE*.md' -o -iname 'AGENTS.md' \) -type f -delete
            find "$work" -type d \( -name .claude -o -name .agents -o -name .agent-ref -o -name .agent-out \) -prune -exec rm -rf {} +
            # The real project plans: the reviewer has no use for them, and what it never reads it can't quote.
            rm -rf "$work/data"
            for f in CLAUDE.md AGENTS.md VISION.md; do git -C epiku-main show "origin/main:$f" > "$work/$f" 2>/dev/null || true; done
            # Into the prompt FILE (the runner's temp dir), never to the log.
            {
              cat "$R/briefs/epiku-reviewer.md"
              echo
              node "$R/read.mjs" pr "$num" "$EPIKU_REPO"
              body="$(GH_TOKEN="$OCTOPUSH_EPIKU_TOKEN" gh api "repos/$EPIKU_REPO/pulls/$num" --jq '.body // ""')"
              for issue in $(printf '%s' "$body" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?):? +#[0-9]+' | grep -oE '[0-9]+$' | head -n 3); do
                echo; node "$R/read.mjs" issue "$issue" "$EPIKU_REPO"
              done
              echo; echo '## Diff (main...head)'; echo '```diff'
              git -C epiku-main -c core.attributesFile=/dev/null diff --text --no-textconv --no-ext-diff "origin/main...$sha"
              echo '```'
            } > "$RUNNER_TEMP/prompt-$num.md" 2> "$RUNNER_TEMP/prepare-$num.log"   # stderr too stays on the runner
            printf '%s\t%s\n' "$num" "$sha" >> "$RUNNER_TEMP/ready.tsv"
            echo "epiku#$num prepared at ${sha:0:7}"
          done < "$RUNNER_TEMP/queue.tsv"

      - name: Revoke the read token
        if: always() && steps.read-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
        run: gh api -X DELETE installation/token >/dev/null 2>&1 || echo "::warning title=token::could not revoke the installation token (it still expires within the hour)"

      - name: Review each PR (Claude agent, no GitHub access)
        if: steps.queue.outputs.count != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          npm install --global --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          R="$RUNNER_TEMP/routines"
          while IFS=$'\t' read -r num sha; do
            work="/tmp/epiku-review/pr-$num"
            (cd "$work" && node "$R/agent.mjs" reviewer "$RUNNER_TEMP/prompt-$num.md") || echo "reviewer agent failed on epiku#$num"
            if [ -f "$work/.agent-out/review.json" ]; then cp "$work/.agent-out/review.json" "$RUNNER_TEMP/review-$num.json"
            else echo "no verdict for epiku#$num — it stays in the queue"; fi
          done < "$RUNNER_TEMP/ready.tsv"

      - name: Epiku token (post verdicts)
        id: post-token
        if: steps.queue.outputs.count != '0'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OCTOPUSH_APP_ID }}
          private-key: ${{ secrets.OCTOPUSH_APP_PRIVATE_KEY }}
          owner: octopush-sh
          repositories: epiku
          permission-issues: write
          permission-pull-requests: write

      - name: Post verdicts (this job never merges)
        if: steps.queue.outputs.count != '0'
        env:
          OCTOPUSH_EPIKU_TOKEN: ${{ steps.post-token.outputs.token }}
          OCTOPUSH_APP_BOT_LOGIN: ${{ steps.queue.outputs.bot }}
          OCTOPUSH_SECRETS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -uo pipefail
          while IFS=$'\t' read -r num sha; do
            f="$RUNNER_TEMP/review-$num.json"
            [ -f "$f" ] || continue
            # Refuses if the head moved since the review; validates the file (verdict,
            # data classification) and scans it first. Prints the number and commit only.
            node "$RUNNER_TEMP/routines/automerge.mjs" --repo "$EPIKU_REPO" review-json "$num" "$sha" "$f" || true
          done < "$RUNNER_TEMP/ready.tsv"

  merge:
    # A fresh runner: no agent ran here and no Epiku code is ever checked out
    # here. It takes nothing from the job above — only what is on the PRs.
    needs: review
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EPIKU_AUTOMERGE: ${{ vars.EPIKU_AUTOMERGE }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Epiku token (merge)
        id: merge-token
        if: vars.EPIKU_AUTOMERGE == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OCTOPUSH_APP_ID }}
          private-key: ${{ secrets.OCTOPUSH_APP_PRIVATE_KEY }}
          owner: octopush-sh
          repositories: epiku
          permission-contents: write        # merge
          permission-pull-requests: write   # merge
          permission-issues: write          # park: `needs-owner` and the reasons
          permission-actions: read          # CI status of the head commit

      - name: Epiku token (dry run — read-only)
        id: dry-token
        if: vars.EPIKU_AUTOMERGE != 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OCTOPUSH_APP_ID }}
          private-key: ${{ secrets.OCTOPUSH_APP_PRIVATE_KEY }}
          owner: octopush-sh
          repositories: epiku
          permission-contents: read
          permission-pull-requests: read
          permission-issues: read
          permission-actions: read

      - name: Merge what the review approved, or park it
        env:
          OCTOPUSH_EPIKU_TOKEN: ${{ steps.merge-token.outputs.token || steps.dry-token.outputs.token }}
          OCTOPUSH_APP_BOT_LOGIN: ${{ steps.merge-token.outputs.app-slug || steps.dry-token.outputs.app-slug }}[bot]
        run: |
          set -uo pipefail
          R=scripts/routines   # main's, on a runner nothing else has touched
          dry=(--dry-run)
          if [ "$EPIKU_AUTOMERGE" = true ]; then dry=(); else echo "EPIKU_AUTOMERGE is not 'true': dry run, nothing is merged, labelled or commented"; fi
          # Approved on their current head, by the reviewer account: numbers only.
          node "$R/automerge.mjs" --repo "$EPIKU_REPO" approved | head -n 10 > "$RUNNER_TEMP/approved.txt" || { echo "::error::could not list the approved PRs"; exit 1; }
          [ -s "$RUNNER_TEMP/approved.txt" ] || echo "no Epiku PR is approved on its head"
          while read -r num; do
            [[ "$num" =~ ^[0-9]+$ ]] || continue
            # Re-checks every rule on the PR's head; prints the number, the commit and reason codes.
            node "$R/automerge.mjs" --repo "$EPIKU_REPO" merge "$num" "${dry[@]}" || true
          done < "$RUNNER_TEMP/approved.txt"
