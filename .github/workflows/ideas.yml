# Daily ideas digest (VISION.md §9, docs/ROUTINES.md). 06:00 Bogotá.
#
# A Claude agent (web search, read-only repo, no GitHub access) researches and
# writes ideas.json; ideas.mjs validates it, files the ideas — app and API ones
# in this repo (labelled area:app|api), website ones in octopush-web — and posts
# the one digest the owner answers. octopush-web is reached with installation
# tokens of the "Octopush Cycle" GitHub App: a read-only one for the context
# (revoked before the agent starts) and a fresh one to file and post.
name: ideas

on:
  schedule:
    - cron: "37 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # idea issues and the digest

concurrency:
  group: ideas
  cancel-in-progress: false

env:
  OCTOPUSH_OWNER_LOGIN: ${{ vars.OCTOPUSH_OWNER_LOGIN }}
  OCTOPUSH_ROUTINE_REPO: ${{ github.repository }}
  CLAUDE_CODE_VERSION: "2.1.314"
  TZ: America/Bogota   # the digest is titled with the owner's date

jobs:
  ideas:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Already posted today?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if node scripts/routines/ideas.mjs check; then echo "go=1" >> "$GITHUB_OUTPUT"; fi

      - name: Web token (context — revoked before the agent)
        id: read-token
        # The web lane is optional: if the App isn't installed on octopush-web
        # (or its key is missing), carry on with the app repo only.
        continue-on-error: true
        if: steps.check.outputs.go == '1'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OCTOPUSH_APP_ID }}
          private-key: ${{ secrets.OCTOPUSH_APP_PRIVATE_KEY }}
          owner: octopush-sh
          repositories: octopush-web
          skip-token-revoke: true
          permission-issues: read
          permission-pull-requests: read
          permission-actions: read

      - name: Context and brief
        if: steps.check.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          OCTOPUSH_WEB_TOKEN: ${{ steps.read-token.outputs.token }}
          OCTOPUSH_APP_BOT_LOGIN: ${{ steps.read-token.outputs.app-slug && format('{0}[bot]', steps.read-token.outputs.app-slug) || '' }}
        run: |
          set -euo pipefail
          cp -R scripts/routines "$RUNNER_TEMP/routines"
          { cat scripts/routines/briefs/ideas.md; echo; node scripts/routines/ideas.mjs context; } > "$RUNNER_TEMP/prompt.md"

      - name: Revoke the context token
        if: always() && steps.read-token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
        run: gh api -X DELETE installation/token >/dev/null 2>&1 || echo "::warning title=token::could not revoke the installation token (it still expires within the hour)"

      - name: Install Claude Code (no token in this step)
        if: steps.check.outputs.go == '1'
        run: npm install --global --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - name: Research (Claude agent, no GitHub access)
        if: steps.check.outputs.go == '1'
        timeout-minutes: 40
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node "$RUNNER_TEMP/routines/agent.mjs" ideas "$RUNNER_TEMP/prompt.md"

      - name: Web token (file website ideas)
        id: post-token
        # The web lane is optional: if the App isn't installed on octopush-web
        # (or its key is missing), carry on with the app repo only.
        continue-on-error: true
        if: steps.check.outputs.go == '1'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OCTOPUSH_APP_ID }}
          private-key: ${{ secrets.OCTOPUSH_APP_PRIVATE_KEY }}
          owner: octopush-sh
          repositories: octopush-web
          permission-issues: write
          permission-pull-requests: read
          permission-actions: read

      - name: Post the digest
        if: steps.check.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          OCTOPUSH_WEB_TOKEN: ${{ steps.post-token.outputs.token }}
          OCTOPUSH_APP_BOT_LOGIN: ${{ steps.post-token.outputs.app-slug && format('{0}[bot]', steps.post-token.outputs.app-slug) || '' }}
          OCTOPUSH_SECRETS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          f=.agent-out/ideas.json
          [ -f "$f" ] || { echo "::error::the agent wrote no $f"; exit 1; }
          if node -e 'const s=process.env.OCTOPUSH_SECRETS.trim(); process.exit(s.length>=8 && require("fs").readFileSync(process.argv[1],"utf8").includes(s)?0:1)' "$f"; then
            echo "::error::ideas.json contains a secret value — not posted"; exit 1
          fi
          node "$RUNNER_TEMP/routines/ideas.mjs" post "$f"
