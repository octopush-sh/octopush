# Daily ideas digest (VISION.md §9, docs/ROUTINES.md). 06:00 Bogotá.
#
# A Claude agent (web search, read-only repo, no GitHub access) researches and
# writes ideas.json; ideas.mjs validates it, files the ideas in this repo
# (labelled area:app|api|web) and posts the digest the owner answers.
name: ideas

on:
  schedule:
    - cron: "37 11 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write   # idea issues and the digest

concurrency:
  group: ideas
  cancel-in-progress: false

env:
  OCTOPUSH_OWNER_LOGIN: ${{ vars.OCTOPUSH_OWNER_LOGIN }}
  OCTOPUSH_ROUTINE_REPO: ${{ github.repository }}
  CLAUDE_CODE_VERSION: "2.1.314"
  TZ: America/Bogota   # the digest is titled with the owner's date

jobs:
  ideas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Already posted today?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if node scripts/routines/ideas.mjs check; then echo "go=1" >> "$GITHUB_OUTPUT"; fi

      - name: Context and brief
        if: steps.check.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp -R scripts/routines "$RUNNER_TEMP/routines"
          { cat scripts/routines/briefs/ideas.md; echo; node scripts/routines/ideas.mjs context; } > "$RUNNER_TEMP/prompt.md"
          npm install --global --no-audit --no-fund "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"

      - name: Research (Claude agent, no GitHub access)
        if: steps.check.outputs.go == '1'
        timeout-minutes: 40
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node "$RUNNER_TEMP/routines/agent.mjs" ideas "$RUNNER_TEMP/prompt.md"

      - name: Post the digest
        if: steps.check.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          OCTOPUSH_SECRETS: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          f=.agent-out/ideas.json
          [ -f "$f" ] || { echo "::error::the agent wrote no $f"; exit 1; }
          if node -e 'const s=process.env.OCTOPUSH_SECRETS.trim(); process.exit(s.length>=8 && require("fs").readFileSync(process.argv[1],"utf8").includes(s)?0:1)' "$f"; then
            echo "::error::ideas.json contains a secret value — not posted"; exit 1
          fi
          node "$RUNNER_TEMP/routines/ideas.mjs" post "$f"
