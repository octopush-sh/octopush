# Nightly beta release (VISION.md §8, docs/ROUTINES.md, docs/RELEASING.md).
#
# If main moved since the last tag and CI is green: collect the changesets,
# bump, open the release PR, wait for CI, merge,
# tag, and start release.yml on the tag — which publishes a beta (prerelease).
# The owner promotes it to stable. No agent involved. 05:00 Bogotá.
name: nightly-release

on:
  schedule:
    - cron: "13 10 * * *"
  workflow_dispatch:

permissions:
  contents: write       # release branch, merge, tag
  pull-requests: write  # release PR
  issues: write         # label it
  actions: write        # dispatch CI and release.yml

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OCTOPUSH_DISPATCH: "1"
      OCTOPUSH_SKIP_CLIPS: "1"
      OCTOPUSH_ROUTINES_KEEP_PATH: "1"
      OCTOPUSH_ROUTINE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Anything to release?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bash scripts/routines/release-beta.sh check
          rc=$?
          case "$rc" in
            0) echo "go=1" >> "$GITHUB_OUTPUT" ;;
            1) echo "nothing to release tonight" ;;
            *) exit "$rc" ;;
          esac

      - name: Cut the beta
        if: steps.check.outputs.go == '1'
        # No agent code runs here: dependencies install without scripts and
        # clips aren't recorded (scripts/routines/release-beta.sh).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/routines/release-beta.sh run
