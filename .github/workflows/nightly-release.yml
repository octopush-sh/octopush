# Nightly beta release (VISION.md §8, docs/ROUTINES.md, docs/RELEASING.md).
#
# If main moved since the last tag and CI is green: collect the changesets,
# bump, open the release PR, wait for CI, merge only if the PR's head still
# contains main (else cut it again from the new main), tag the merge — which
# has the tree CI tested — and start release.yml on the tag, which publishes a
# beta (prerelease).
# The owner promotes it to stable. No agent involved. Twice a day: 05:13 and
# 17:13 Bogotá.
name: nightly-release

on:
  schedule:
    - cron: "13 10,22 * * *"
  workflow_dispatch:

permissions:
  contents: write       # release branch, merge, tag
  pull-requests: write  # release PR
  issues: write         # label it
  actions: write        # dispatch CI and release.yml

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    # The check waits up to 30 min for main's CI; the cut has its own limit
    # below, and the job leaves room after it for the clean-up step.
    timeout-minutes: 230
    env:
      OCTOPUSH_DISPATCH: "1"
      OCTOPUSH_SKIP_CLIPS: "1"
      OCTOPUSH_ROUTINES_KEEP_PATH: "1"
      OCTOPUSH_ROUTINE_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Anything to release?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          bash scripts/routines/release-beta.sh check
          rc=$?
          case "$rc" in
            0) echo "go=1" >> "$GITHUB_OUTPUT" ;;
            1) echo "nothing to release tonight" ;;
            *) exit "$rc" ;;
          esac

      - name: Cut the beta
        if: steps.check.outputs.go == '1'
        # No agent code runs here: dependencies install without scripts and
        # clips aren't recorded (scripts/routines/release-beta.sh). CI on the
        # release PR (≤ 45 min, longer with starved re-runs), again after a
        # re-cut, and CI on the merge itself when main slipped in: a step
        # limit, so a run that overruns still gets the clean-up below.
        timeout-minutes: 180
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/routines/release-beta.sh run

      - name: Close a release PR the run left open
        # A finished run leaves none (merged, or closed by its own failure
        # path). One left by a timeout or a cancel would pause auto-merge
        # (automerge.mjs): close it; the next run starts over.
        if: always() && steps.check.outputs.go == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == "'"$GITHUB_REPOSITORY"'" and (.head.ref | test("^release/v[0-9]+[.][0-9]+[.][0-9]+$"))) | .number')" || { echo "::warning::could not list open PRs"; exit 0; }
          for n in $prs; do
            gh api "repos/$GITHUB_REPOSITORY/issues/$n/comments" -f body="The nightly release run stopped before it finished (timeout or cancel), so this release PR is closed: auto-merge resumes, and the next run starts over." >/dev/null || true
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/pulls/$n" -f state=closed >/dev/null && echo "closed release PR #$n" || echo "::warning::could not close release PR #$n"
          done
