name: CI

# Every PR (including the ones agents open) must pass this before review.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    # The frontend suite is platform-agnostic (jsdom), so it runs on Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  backend:
    # Keychain, the seatbelt sandbox and PTY code are macOS-only.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # tauri::generate_context! expects build.frontendDist (../dist) to exist;
      # the Rust tests don't need the real bundle.
      - run: mkdir -p dist && touch dist/index.html
      # The PTY/talk-shell tests spawn the real octopush-pty-server daemon, and
      # build.rs only stages empty placeholders until the sidecars are built.
      - name: build sidecar binaries
        working-directory: src-tauri
        run: cargo build --locked --bins
      - name: cargo test
        working-directory: src-tauri
        shell: bash
        # Failures are also surfaced as an annotation: agents read CI through the
        # API (annotations), not through raw log downloads.
        run: |
          set -o pipefail
          if ! cargo test --locked 2>&1 | tee "$RUNNER_TEMP/cargo-test.log"; then
            summary="$(grep -E '^(error(\[E[0-9]+\])?:|test .* \.\.\. FAILED|thread .* panicked|failures:|    [a-z_:]+$|  --> |assertion|^  left|^ right|^called `Result::unwrap\(\)`)' "$RUNNER_TEMP/cargo-test.log" | head -n 80 || true)"
            [ -n "$summary" ] || summary="$(tail -n 40 "$RUNNER_TEMP/cargo-test.log")"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/'%0D'}"
            echo "::error title=cargo test failed::${summary//$'\n'/'%0A'}"
            exit 1
          fi
      - name: cargo clippy
        working-directory: src-tauri
        # Warnings are reported, not fatal, until the existing ones are cleaned up.
        run: cargo clippy --locked --all-targets

  repo-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: AGENTS.md mirrors CLAUDE.md
        run: node scripts/check-agents-md.mjs
      - run: npm ci
      - name: what's-new changesets are valid
        run: node --test scripts/whats-new.test.mjs && node scripts/whats-new.mjs check
      - name: routine scripts parse
        run: for f in scripts/routines/*.sh; do bash -n "$f" || exit 1; done
