# Nightly web audit (scripts/web-audit/README.md, docs/ROUTINES.md).
#
# Builds octopush-web's main (what merging publishes), serves dist/ and renders
# every page in Playwright Chromium at 1440×900, 1024×700 and 390×844: the app
# audit's layout checks (scripts/visual-audit/checks.mjs) plus website checks —
# content past the window edge on mobile, placeholder copy, retired glyphs,
# italics, missing title/description/social tags, broken internal links and
# anchors. New defects become `visual` issues in octopush-web (deduplicated by
# fingerprint, capped like the app audit; the first two `ready` for the web
# builder). No agent runs here.
#
# Three jobs, so the website's own code never runs where the GitHub App's
# private key is (a job's secrets are on its runner, and the build — Astro
# config, integrations, dependencies — is the website's code):
#   token  mints a read-only (contents: read) installation token for
#          octopush-web with the key and hands it on as a job output;
#   audit  references NO secret: masks that token, checks out with it, revokes
#          it and proves it dead, and only then builds and renders the site;
#   file   a fresh runner with this repo's trusted scripts: downloads the
#          findings, mints an issues-only token and files them.
# 00:49 Bogotá, after the app audit.
name: web-audit

on:
  schedule:
    - cron: "49 5 * * *"
  workflow_dispatch:
    inputs:
      file_issues:
        description: "File issues for the findings"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: web-audit
  cancel-in-progress: false

env:
  PLAYWRIGHT_VERSION: "1.64.1"

jobs:
  token:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      read: ${{ steps.mint.outputs.read }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Read-only token for the checkout (contents:read, octopush-web only)
        id: mint
        env:
          OCTOPUSH_APP_ID: ${{ secrets.OCTOPUSH_APP_ID }}
          OCTOPUSH_APP_PRIVATE_KEY: ${{ secrets.OCTOPUSH_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          t="$(node scripts/routines/app-token.mjs read-token)"
          echo "read=$t" >> "$GITHUB_OUTPUT"

  audit:
    needs: token
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      rc: ${{ steps.audit.outputs.rc }}
    # This job references no secret at all: it runs the website's code.
    steps:
      - name: Mask the read token
        env:
          READ_TOKEN: ${{ needs.token.outputs.read }}
        run: echo "::add-mask::$READ_TOKEN"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Check out octopush-web (main)
        uses: actions/checkout@v7
        with:
          repository: octopush-sh/octopush-web
          token: ${{ needs.token.outputs.read }}
          path: site
          persist-credentials: false

      - name: Revoke the read token (before any of the site's code runs)
        env:
          GH_TOKEN: ${{ needs.token.outputs.read }}
        run: |
          set -uo pipefail
          gh api -X DELETE installation/token >/dev/null 2>&1
          # Proven dead, or the build doesn't start.
          if gh api repos/octopush-sh/octopush-web --silent >/dev/null 2>&1; then
            echo "::error::the read token still works after revoking it — not building the site"; exit 1
          fi

      - name: Build the site and install Chromium (no token in this job any more)
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          set -euo pipefail
          (cd site && npm ci --no-audit --no-fund --ignore-scripts && npm run build)
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund --ignore-scripts "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium

      - name: Audit (Chromium, every page, three window sizes)
        id: audit
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          set +e
          node scripts/web-audit/audit.mjs --site site --out "$RUNNER_TEMP/web-audit"
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # The repo is private but this repo's artifacts are public: no
          # screenshots of the legal pages (they are the owner's to publish).
          find "$RUNNER_TEMP/web-audit/shots" -type f \( -name 'privacy--*' -o -name 'terms--*' -o -name 'refunds--*' \) -delete 2>/dev/null
          # 0 = clean, 1 = findings (filed by the next job); anything else is the audit failing.
          [ "$rc" -le 1 ] || exit "$rc"

      - name: Keep the findings and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-audit
          path: ${{ runner.temp }}/web-audit
          retention-days: 3
          if-no-files-found: ignore

  file:
    needs: audit
    if: needs.audit.outputs.rc == '1' && (github.event_name == 'schedule' || inputs.file_issues)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # A fresh runner and this repo's own scripts: nothing from the website ran here.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: web-audit
          path: ${{ runner.temp }}/web-audit

      - name: Web token (file issues)
        id: file-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.OCTOPUSH_APP_ID }}
          private-key: ${{ secrets.OCTOPUSH_APP_PRIVATE_KEY }}
          owner: octopush-sh
          repositories: octopush-web
          permission-issues: write

      - name: File issues in octopush-web
        # findings.json came from a job that ran the website's code: it is data.
        # file.mjs caps what it files (5 new, 10 open, 2 ready, 3 reopened),
        # neutralises routine markers and @mentions in page text.
        env:
          OCTOPUSH_WEB_TOKEN: ${{ steps.file-token.outputs.token }}
        run: node scripts/visual-audit/file.mjs --repo octopush-sh/octopush-web "$RUNNER_TEMP/web-audit/findings.json"
